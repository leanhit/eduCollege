version: '3.8'

services:
  # ========================================
  # PostgreSQL Shared (pgvector)
  # ========================================
  db:
    image: ankane/pgvector:latest
    container_name: educollege_postgres
    restart: always
    environment:
      POSTGRES_DB: educollege_db
      POSTGRES_USER: educollege_user
      POSTGRES_PASSWORD: educollege_Admin_2025
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./app-setup/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U educollege_user -d educollege_db"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ========================================
  # Identity Hub Database - REMOVED (not needed for eduCollege)
  # ========================================
  # MinIO
  # ========================================
  minio:
    image: quay.io/minio/minio
    container_name: minio
    restart: always
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9090"
    ports:
      - "9000:9000"
      - "9090:9090"
    volumes:
      - minio_data:/data
    networks:
      - internal

  # ========================================
  # Botpress - REMOVED (not needed for eduCollege)
  # ========================================

  # ========================================
  # Odoo - REMOVED (not needed for eduCollege)
  # ========================================

volumes:
  postgres_data:
  minio_data:

networks:
  internal:
    driver: bridge
