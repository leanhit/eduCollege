# Backend Deployment for eduCollege University System
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: educollege
  labels:
    app: educollege
    component: backend
    version: v1.0
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: educollege
      component: backend
  template:
    metadata:
      labels:
        app: educollege
        component: backend
        version: v1.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/actuator/prometheus"
        sidecar.istio.io/inject: "true"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
      - name: backend
        image: educollege/backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "production"
        - name: JAVA_OPTS
          value: "-Xms512m -Xmx1g -XX:+UseG1GC -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
        - name: SPRING_CONFIG_LOCATION
          value: "classpath:/application.yml,/app/config/"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: educollege-secrets
              key: jwt-secret
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: educollege-secrets
              key: postgres-password
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: educollege-secrets
              key: redis-password
        - name: MINIO_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: educollege-secrets
              key: minio-secret-key
        - name: RABBITMQ_PASSWORD
          valueFrom:
            secretKeyRef:
              name: educollege-secrets
              key: rabbitmq-password
        - name: IDENTITY_DB_URL
          valueFrom:
            secretKeyRef:
              name: educollege-secrets
              key: identity-db-url
        - name: USER_DB_URL
          valueFrom:
            secretKeyRef:
              name: educollege-secrets
              key: user-db-url
        - name: TENANT_DB_URL
          valueFrom:
            secretKeyRef:
              name: educollege-secrets
              key: tenant-db-url
        - name: APP_DB_URL
          valueFrom:
            secretKeyRef:
              name: educollege-secrets
              key: app-db-url
        - name: BILLING_DB_URL
          valueFrom:
            secretKeyRef:
              name: educollege-secrets
              key: billing-db-url
        - name: WALLET_DB_URL
          valueFrom:
            secretKeyRef:
              name: educollege-secrets
              key: wallet-db-url
        - name: CONFIG_DB_URL
          valueFrom:
            secretKeyRef:
              name: educollege-secrets
              key: config-db-url
        - name: MESSAGE_DB_URL
          valueFrom:
            secretKeyRef:
              name: educollege-secrets
              key: message-db-url
        volumeMounts:
        - name: config-volume
          mountPath: /app/config
          readOnly: true
        - name: logs-volume
          mountPath: /app/logs
        - name: uploads-volume
          mountPath: /app/uploads
        - name: temp-volume
          mountPath: /app/tmp
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
          successThreshold: 1
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
          successThreshold: 1
        startupProbe:
          httpGet:
            path: /actuator/health
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
          successThreshold: 1
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      volumes:
      - name: config-volume
        configMap:
          name: educollege-config
          items:
          - key: application.yml
            path: application.yml
          - key: logback.xml
            path: logback.xml
      - name: logs-volume
        emptyDir: {}
      - name: uploads-volume
        persistentVolumeClaim:
          claimName: uploads-pvc
      - name: temp-volume
        emptyDir: {}
      nodeSelector:
        kubernetes.io/hostname: educollege-node
      tolerations:
      - key: "workload"
        operator: "Equal"
        value: "educollege"
        effect: "NoSchedule"
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - educollege
              topologyKey: kubernetes.io/hostname
---
# Horizontal Pod Autoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
  namespace: educollege
  labels:
    app: educollege
    component: backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
      - type: Pods
        value: 2
        periodSeconds: 60
      selectPolicy: Max
