# Redis Performance Optimization Configuration for EduCollege University System

# Memory Configuration
maxmemory 512mb
maxmemory-policy allkeys-lru

# Persistence Configuration
appendonly yes
appendfsync everysec

# Port configuration
port 6380

# Logging Configuration
loglevel notice
logfile "/var/log/redis/redis-server.log"

# Custom Configuration for EduCollege
# - User sessions
# - Academic data cache
# - Rate limiting data
notify-keyspace-events "Ex"
