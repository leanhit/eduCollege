# eduCollege University System Configuration
spring:
  
  # Application Configuration
  application:
    name: educollege
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:development}
  
  # Database Configuration - PostgreSQL
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/educollege_db}
    username: ${DATABASE_USER:educollege_user}
    password: ${DATABASE_PASSWORD:educollege_Admin_2025}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 20000
      
  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        use_sql_comments: false
        
  # Redis Configuration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          
  # File Storage Configuration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
      
  # Server Configuration
  server:
    port: ${SERVER_PORT:8080}
    servlet:
      context-path: /
    compression:
      enabled: true
      mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/json,application/xml
      
  # Management Configuration
  management:
    endpoints:
      web:
        exposure:
          include: health,info,metrics,prometheus
    endpoint:
      health:
        show-details: always
    metrics:
      export:
        prometheus:
          enabled: true
          
  # Logging Configuration
  logging:
    level:
      com.educollege: INFO
      org.springframework.web: INFO
      org.springframework.security: INFO
    pattern:
      console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
      file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file:
      name: logs/educollege.log
      max-size: 100MB
      max-history: 30
      
  # Security Configuration
  security:
    jwt:
      secret: ${JWT_SECRET:your-256-bit-secret}
      expiration: 86400000 # 24 hours
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}
      allowed-methods: GET,POST,PUT,DELETE,OPTIONS
      allowed-headers: "*"
      allow-credentials: true
      
  # MinIO Configuration
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:educollege-files}
    region: us-east-1
    console-url: ${MINIO_CONSOLE_URL:http://localhost:9090}

# eduCollege Configuration
educollege:
  # Vietnamese ID Configuration
  vietnamese-id:
    student:
      prefix: SV
      year-format: YY
      faculty-code-length: 3
      sequence-length: 5
    teacher:
      prefix: GV
      department-code-length: 4
      sequence-length: 4
    staff:
      prefix: NV
      faculty-code-length: 3
      dept-type-length: 2
      sequence-length: 4
  
  # Academic Rules Configuration
  academic:
    # GPA Requirements
    min-gpa: 2.0
    honors-gpa: 3.6
    passing-gpa: 2.0
    
    # Credit Limits
    max-failed-credits: 12
    max-total-credits: 200
    graduation-credits: 120
    
    # Course Load by Academic Level
    course-load:
      daihoc: 25
      caodang: 20
      thacsi: 18
      tiensi: 15
    
    # Attendance Requirements
    min-attendance-rate: 75.0
    
    # Academic Standing Thresholds
    academic-standing:
      good:
        min-gpa: 2.0
        max-failed-credits: 6
      probation:
        min-gpa: 1.5
        max-failed-credits: 12
      suspended:
        min-gpa: 0.0
        max-failed-credits: 12
  
  # Grading Scale Configuration (Vietnamese 10-point scale)
  grading:
    scale: 10-point
    ranges:
      A:
        min: 9.0
        max: 10.0
        gpa: 4.0
      B+:
        min: 8.5
        max: 8.9
        gpa: 3.5
      B:
        min: 8.0
        max: 8.4
        gpa: 3.0
      C+:
        min: 7.0
        max: 7.9
        gpa: 2.5
      C:
        min: 6.5
        max: 6.9
        gpa: 2.0
      D+:
        min: 5.5
        max: 6.4
        gpa: 1.5
      D:
        min: 5.0
        max: 5.4
        gpa: 1.0
      F:
        min: 0.0
        max: 4.9
        gpa: 0.0
